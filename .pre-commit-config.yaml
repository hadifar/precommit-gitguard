# Dogfooding config for this repo's own source tree.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # type checking via pyright
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        name: "🐍 python · Check types"
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true

# pre-commit.ci (https://pre-commit.ci) autofixes/autoupdates on PRs once the
# GitHub App is installed for this repo. `pytest` is skipped there: it's a
# `language: system` local hook, which pre-commit.ci's sandbox doesn't run.
ci:
  autofix_commit_msg: "style: pre-commit.ci auto fixes"
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore: pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [pytest]
  submodules: false
