[project]
name = "gitguard"
version = "0.1.2"
description = "Gitflow guardrails as pre-commit hooks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hadifar" }]

[project.scripts]
gitguard-no-direct-commit = "gitguard.no_direct_commit:main"
gitguard-no-direct-push = "gitguard.no_direct_push:main"
gitguard-branch-name = "gitguard.branch_name:main"
gitguard-stale-branch = "gitguard.stale_branch:main"

[project.optional-dependencies]
dev = ["ruff","pytest>=7", "commitizen>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitguard"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"

[tool.ruff.lint]
extend-select = ["C901", "B", "SIM", "C4", "RET", "UP", "ERA", "PLR2004", "PTH"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
version_files = ["README.md:rev: v"]
update_changelog_on_bump = true
tag_format = "v$version"
major_version_zero = true
